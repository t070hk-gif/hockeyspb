name: cloud-backup
# Облачный резервный бот: работает, только если MacBook и резервный Mac молчат дольше 25 минут.
on:
  schedule:
    - cron: "*/20 5-20 * * *"        # каждые 20 минут, 8:00–23:40 по Москве; включается утром, только в дни с играми
  workflow_dispatch: {}
concurrency:
  group: cloud-backup
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Europe/Moscow
      GH_BACKUP_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v5
        with:
          ref: code
          fetch-depth: 1
      - name: Нужно ли работать
        id: check
        run: |
          printf '%s' "${{ secrets.VKBOT_KEY }}" > ~/.vkbot_key
          chmod 600 ~/.vkbot_key
          python3 gh_backup.py cloud-check
      - uses: actions/setup-python@v6
        if: steps.check.outputs.work == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Работа вместо компьютеров
        if: steps.check.outputs.work == 'yes'
        env:
          CLOUD_MODE: ${{ steps.check.outputs.mode }}
          VK_SERVICE_KEY: ${{ secrets.VK_SERVICE_KEY }}   # необязательно: иначе ключ берётся из config.json снимка
        run: |
          md=$(date +%m%d)
          if [ "$md" -ge 1215 ] || [ "$md" -le 0110 ]; then sudo apt-get install -y -qq ffmpeg > /dev/null; fi
          python -m pip install -q -r requirements-cloud.txt
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-rus > /dev/null || echo 'tesseract не установился — обложки не читаем'
          python gh_backup.py cloud
